name: Offline image release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Verify release
        run: |
          go test ./...
          cd frontend
          npm ci
          npm run build
      - name: Build offline image archive
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: ./scripts/release-image.sh "$RELEASE_VERSION"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" "dist/trace-$RELEASE_VERSION.tar.gz" --title "Trace $RELEASE_VERSION" --generate-notes --verify-tag
